services:
  # ──────────────────────────────────────
  # Main API Server
  # ──────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/chatbot.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEBUG=true
      - LIVEKIT_URL
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - OPENAI_API_KEY
      - DEEPGRAM_API_KEY
      - CARTESIA_API_KEY
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - chatbot-net

  # ──────────────────────────────────────
  # Qdrant Vector Database
  # ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck to avoid blocking dependencies in specific environments
    restart: unless-stopped
    networks:
      - chatbot-net

  # ──────────────────────────────────────
  # Voice Agent Worker
  # ──────────────────────────────────────
  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile.voice
    command: python -m app.voice.worker dev
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LIVEKIT_URL
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET
      - OPENAI_API_KEY
      - DEEPGRAM_API_KEY
      - CARTESIA_API_KEY
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - chatbot-net

volumes:
  qdrant_data:

networks:
  chatbot-net:
    driver: bridge
